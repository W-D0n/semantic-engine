[package]
name = "semantic-engine-desktop"
version = "0.1.0"
description = "Portable local-first Semantic Engine console"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "semantic_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semantic-engine-context-index = { path = "../../../crates/semantic-engine-context-index" }
semantic-engine-context-store = { path = "../../../crates/semantic-engine-context-store" }
semantic-engine-core = { path = "../../../crates/semantic-engine-core" }
semantic-engine-loopback = { path = "../../../crates/semantic-engine-loopback" }
semantic-engine-source-runtime = { path = "../../../crates/semantic-engine-source-runtime" }
semantic-engine-package = { path = "../../../crates/semantic-engine-package" }
semantic-engine-service = { path = "../../../crates/semantic-engine-service" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio.workspace = true

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
