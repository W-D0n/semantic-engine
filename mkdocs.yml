site_name: Semantic Engine
site_description: Moteur local-first de reconnaissance sémantique pour chats
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Accueil: index.md
  - Langage du domaine: domain-language.md
  - Produit:
      - Vision: product/vision.md
      - Sécurité et cadre légal: product/security-and-legal.md
      - Marché: product/market.md
      - Application portable: product/portable-desktop.md
      - Audit local: product/audit.md
      - Performance et benchmark: product/performance.md
  - Architecture:
      - Vue d’ensemble: architecture/overview.md
      - Pipeline: architecture/recognition-pipeline.md
  - Intégration:
      - Sidecar JSONL générique: integration/jsonl-sidecar.md
      - API locale HTTP et WebSocket: integration/loopback-api.md
      - Chat Twitch: integration/twitch.md
      - Paquets de contexte: integration/context-packages.md
  - Recherche:
      - Solutions et données existantes: research/existing-solutions-and-data.md
      - Conventions des paquets: research/context-package-conventions.md
  - Exécution:
      - Roadmap: roadmap.md
      - Continuité: contributing/session-continuity.md
  - Décisions:
      - Moteur et adaptateurs: adr/0001-separate-engine-from-adapters.md
      - Pipeline hybride: adr/0002-hybrid-recognition.md
      - Déploiement évolutif: adr/0003-evolutive-deployment.md
      - Paquets Data Package: adr/0004-context-data-package.md
      - Brouillons locaux et décision opérateur: adr/0005-local-context-drafts.md
      - Produit autonome et interface publique: adr/0006-autonomous-public-interface.md
      - Audit minimisé et persistant: adr/0007-privacy-minimized-audit.md
      - Service d’application et cache borné: adr/0008-application-service-cache.md
      - Cycle de session et événements: adr/0009-session-cycle-and-events.md
      - Coffre natif et OAuth Twitch: adr/0010-native-vault-and-twitch-device-flow.md
