[workspace]
members = [
  "crates/semantic-engine-core",
  "crates/semantic-engine-package",
  "crates/semantic-engine-context-store",
  "crates/semantic-engine-audit-store",
  "crates/semantic-engine-service",
  "crates/semantic-engine-session-store",
  "crates/semantic-engine-memory-store",
  "crates/semantic-engine-protocol",
  "crates/semantic-engine-loopback",
  "crates/semantic-engine-source",
  "crates/semantic-engine-credential-vault",
  "crates/semantic-engine-twitch",
  "crates/semantic-engine-youtube",
  "crates/semantic-engine-source-runtime",
  "crates/semantic-engine-vectors",
  "apps/semantic-engine-cli",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
unicode-normalization = "0.1"
semver = "1"
sha2 = "0.10"
spdx = "0.13.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.4.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["cors", "limit"] }
keyring = "4.1.5"
zeroize = "1.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "rustls", "stream", "system-proxy"] }
futures-util = "0.3.32"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
base64 = "0.22.1"
prost = "0.14.1"
prost-types = "0.14.1"
tonic = { version = "0.14.6", features = ["transport", "tls-webpki-roots", "tls-ring"] }
tonic-prost = "0.14.6"
tokio-stream = { version = "0.1.17", features = ["net"] }
